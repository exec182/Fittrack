services:
  webserver:
    build:
      context: .
      dockerfile: ./webserver/Dockerfile
    container_name: diattool_webserver
    ports:
      - "${WEB_BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-8080}:80"
    environment:
      - MYSQL_HOST=${MYSQL_HOST}
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - TRUST_PROXY_HTTPS=${TRUST_PROXY_HTTPS:-0}
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - share_pictures:/var/www/html/share_pictures
    networks:
      - diattool_network

  mysql:
    build:
      context: ./mysql
      dockerfile: Dockerfile
    container_name: diattool_mysql
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
#    ports:
#      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      - diattool_network

  phpmyadmin:
    image: phpmyadmin:5.2.2
    profiles: ["tools"]
    container_name: diattool_phpmyadmin
    ports:
      - "127.0.0.1:8091:80"
    environment:
      - PMA_HOST=${MYSQL_HOST}
      - PMA_DATABASE=${MYSQL_DATABASE}
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - diattool_network

volumes:
  mysql_data:
  share_pictures:

networks:
  diattool_network:
    driver: bridge
